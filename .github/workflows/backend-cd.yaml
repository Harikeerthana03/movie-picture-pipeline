name: Backend CD

on:
  push:
    paths:
      - 'backend/**'
      - 'starter/backend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        working-directory: ./starter/backend
        run: pipenv install --dev

      - name: Run Linter
        working-directory: ./starter/backend
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install Dependencies
        working-directory: ./starter/backend
        run: pipenv install --dev

      - name: Run Tests
        working-directory: ./starter/backend
        run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image with SHA Tag
        working-directory: ./starter/backend
        run: docker build --tag backend:${{ github.sha }} .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Kustomize & Apply Manifests
        working-directory: ./starter/backend/k8s
        run: |
          kustomize edit set image backend=<ECR_REPO_URL>:${{ github.sha }}
          kustomize build | kubectl apply -f -