name: Frontend CD

on:
  push:
    paths:
      - 'frontend/**'
      - 'starter/frontend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./starter/frontend
        run: CI=true npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image with SHA Tag
        working-directory: ./starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag frontend:${{ github.sha }} .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Kustomize & Apply Manifests
        working-directory: ./starter/frontend/k8s
        run: |
          kustomize edit set image frontend=<ECR_REPO_URL>:${{ github.sha }}
          kustomize build | kubectl apply -f -